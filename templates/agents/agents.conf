# .claude/agents.conf — the model and effort of each role an agent of this project runs as.
#
# One line per role: the model, then the effort (low, medium, high, xhigh, max). "inherit"
# runs an agent a session starts on the session's model; review.sh refuses it, because it
# starts the reviewer and the maintainer in a process of their own. review.sh and the skills
# that start agents read this file and print what each role runs on.

EXECUTOR=opus high      # writes and fixes the code
REVIEWER=opus high      # reviews the change
MAINTAINER=opus         # sorts the review's findings
QA=sonnet medium        # the checks of /qa on simulators and devices
HELPER=sonnet low       # searching and reading for the session
