# .review/land.conf — landing and advancing switches.
#
# Belongs to the project, not the CodingStandards submodule.
#
# Read as DATA, never sourced — `KEY=value` per line, one value each. Shell
# expansions, command substitutions and functions here do nothing: the scripts
# with commit authority must not be redefinable from a file the project edits.
# Inline `# comments` after a value are stripped.
#
# Three kinds of key live here, and the difference matters:
#
#   Enforced by a script — LANDING, WITH_RECORDS, REMOTE, BASE_BRANCH, CHECKS_WAIT,
#   THRESHOLD, PROTECTED_BRANCHES, MIN_FREE_GB. `land.sh`, `publish.sh` and `review.sh`
#   read these. Setting
#   them changes what the pipeline can do, whatever any agent believes. The scripts
#   do what the line says and cannot read the requirements, so a change to this file asks
#   you first (the `ask` rules in TASK_LOOP.md, "Landing").
#
#   A warning from a script — ASK_AFTER_RUNS. `review.sh` stops there and says you
#   decide; the maintainer goes past it with --past-limit on your answer, or
#   when the count is wrong, and says so.
#
#   Read by the maintainer — ADVANCE, ADVANCE_CATEGORIES, RISK_PATHS,
#   CONFIRM_AFTER. No line of shell reads these; they are instructions to a
#   model, followed as reliably as a model follows instructions. They govern
#   whether you get asked, never whether a commit is allowed — everything that
#   gates a commit is in the first group, by design.

# ---------------------------------------------------------------------------
# Landing — how far does the loop take a finished task?
# ---------------------------------------------------------------------------

# Your answer to "Who writes to git" in the requirements is the permission, and
# /maintain --init writes it here, the first time and each time the answer changes.
# With no answer the value stays off.
#
# off   — (a) land.sh checks everything, then prints the commit for the
#         maintainer, who gives you the files and the message. You commit.
# push  — (b) land.sh commits, publish.sh pushes the branch. You merge it.
# pr    — (c) the same, and publish.sh opens a pull request. You merge it.
# merge — (d) the same, and publish.sh merges the pull request once the checks
#         pass and no changes are requested.
# on    — land.sh commits on the current branch and publishes nothing; a
#         protected branch is refused.
#
# Any other value is refused, and so is a line that only looks like one of these.
# A value lower than your answer is yours to set at any time: off stops the loop
# from committing and publishing, and /maintain goes on with it.
#
# At push, pr and merge the work leaves a protected branch for task/<id>, created by
# land.sh just before the commit. The loop reaches the base branch at merge alone,
# only through a pull request, never by a direct commit (TASK_LOOP.md, "Landing").
LANDING=off

# The loop's records in the task's commit: yes — the requirements, the plan, the
# decision logs and REVIEW_POLICY.md land with the task, one commit per task; no —
# they stay in the tree for you to commit. The loop's settings (this file and
# gates.sh) and the task file never land with a task.
WITH_RECORDS=no

# Findings at or above this severity block landing.
THRESHOLD=major

# Additional protected branches. `main` and `master` are built in and cannot be
# removed here — this list only ever adds to them. Case is ignored. At push, pr and
# merge the base branch is protected too.
PROTECTED_BRANCHES=""

# The remote to publish to. Empty: `origin` if it exists, otherwise the only
# remote; with several and none named origin, landing refuses until this is set.
REMOTE=""

# The branch pull requests go to. Empty: the HEAD of the remote, asked at every
# landing; a remote with no HEAD means main if it exists, otherwise master, and a
# remote that cannot be reached is a refusal. At pr and merge it must be on the remote.
BASE_BRANCH=""

# Seconds publish.sh waits at LANDING=merge for checks to appear after a push and
# then to finish. Set a little more than your checks take, and a landing ends in one
# run; with less it ends with checks pending, and publish.sh is run again. Checks
# show up on a commit some seconds after it arrives, and gh reports none until
# then. Only a repository that reports none after this long merges without any.
# Set it to 0 in a repository that has no checks at all.
CHECKS_WAIT=30

# ---------------------------------------------------------------------------
# Runs — when does the loop stop and ask?
# ---------------------------------------------------------------------------

# Runs of review.sh on one task before it stops and you decide whether to go on:
# every run that got as far as the gates — rounds, red gates, unusable reviews,
# and the reviews again after /qa, an answer "fixed" or a landing refusal. 5
# leaves room for the three or four rounds of a large change; a large task that
# also had a red gate reaches it, and you are asked. review.sh --past-limit runs
# once more and starts the count again.
ASK_AFTER_RUNS=5

# Free disk, in gigabytes, below which review.sh runs nothing: builds, simulators and
# recordings take gigabytes, and a full disk stops your own work too.
MIN_FREE_GB=15

# ---------------------------------------------------------------------------
# Advancing — may the maintainer take the next task without asking?
# ---------------------------------------------------------------------------

# ask  — every finished task is shown to you before the next one starts
# auto — categories listed in ADVANCE_CATEGORIES advance without waiting, with one
#        line on what landed and what starts; the rest ask. At every LANDING but off,
#        and only once the landing has finished: land.sh or the last publish.sh
#        after it ended with 0.
# Start at ask. Nothing moves you off it: no count of quiet tasks unlocks a
# category, because whether you go on looking is yours to decide
# (MAINTAINER_TRAINING.md).
ADVANCE=ask

# Space-separated task categories you have decided you no longer need to see.
# You add them, by hand, one at a time. One objection reverts a category to ask.
ADVANCE_CATEGORIES=""

# Paths that always ask, whatever else is set here. Some code never advances
# without you.
RISK_PATHS="src/auth/* src/payments/* src/db/migrations/*"

# How many later tasks in the same area must be accepted and committed before an accepted task is
# treated as confirmed rather than provisional. Your approval at the boundary is
# quick; the consequences surface tasks later, which is what `/policy --trace`
# walks back through. Nothing here unlocks a category — you do that.
CONFIRM_AFTER=5
