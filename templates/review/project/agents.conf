# .review/agents.conf — the model and effort of each role the loop starts.
#
# One line per role: the model, then the effort (low, medium, high, xhigh, max).
# "inherit" runs the role on the model Claude Code is set to. review.sh and the
# skills that start agents read this file and print what each role runs on.

EXECUTOR=opus high      # writes and fixes the code
REVIEWER=opus high      # reviews the change
MAINTAINER=inherit      # sorts the review's findings
QA=sonnet medium        # the checks of /qa on simulators and devices
HELPER=sonnet low       # searching and reading for the session
